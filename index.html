<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Two Wild to Handle — A Jungle Birthday Tale</title>
  <meta name="description" content="Once upon a time in the jungle… join us for our little explorer’s 2nd birthday. Sunday, August 16th at 6:00 PM." />
  <meta property="og:title" content="Two Wild to Handle — Jungle Birthday" />
  <meta property="og:description" content="Sunday, August 16th · 6:00 PM · New Hudson, MI" />
  <meta property="og:image" content="assets/jungle-storybook.jpg?v=9" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1f1812;
      --moss: #23401f;
      --gold: #c9a84c;
      --cream: #fff8e8;
      --bark: #6b4226;
      --bark-deep: #2f1c0e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: #142014;
    }

    body { color: var(--ink); }

    .page {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem 0.85rem;
      /* keep giraffe head in frame */
      background: url("assets/jungle-storybook.jpg?v=9") center 35% / cover no-repeat;
      overflow: hidden;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background:
        radial-gradient(ellipse 90% 80% at 50% 48%, transparent 50%, rgba(8, 16, 8, 0.42) 100%);
    }

    /* Readable parchment mist that still fades into the art */
    .tale {
      position: relative;
      z-index: 2;
      width: min(100%, 360px);
      text-align: center;
      padding: 1.55rem 1.25rem 1.35rem;
      background:
        radial-gradient(
          ellipse 80% 75% at 50% 50%,
          rgba(255, 248, 230, 0.92) 0%,
          rgba(255, 244, 214, 0.78) 42%,
          rgba(255, 240, 200, 0.35) 68%,
          rgba(255, 240, 200, 0) 86%
        );
      border: none;
      box-shadow: none;
      animation: settle 1.1s cubic-bezier(0.22, 0.9, 0.25, 1) both;
    }

    .chapter {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-size: 0.95rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--moss);
      font-weight: 700;
      margin-bottom: 0.45rem;
    }

    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 700;
      font-size: clamp(2.4rem, 10vw, 3rem);
      line-height: 0.95;
      color: var(--bark-deep);
      -webkit-text-stroke: 0.5px rgba(255, 248, 232, 0.35);
    }
    h1 em {
      display: block;
      font-style: italic;
      font-weight: 600;
      color: var(--moss);
      font-size: 0.9em;
      margin-top: 0.08rem;
    }

    .rule {
      width: 4rem;
      height: 2px;
      margin: 0.75rem auto;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .lede {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.25rem;
      line-height: 1.38;
      font-weight: 700;
      color: var(--ink);
    }
    .lede strong { color: var(--moss); }

    .facts {
      list-style: none;
      margin: 0.95rem 0 1.05rem;
      padding: 0.65rem 0.4rem;
      background: rgba(255, 248, 232, 0.55);
      border-radius: 0.75rem;
      border: 1px solid rgba(90, 70, 40, 0.18);
    }
    .facts li {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.18rem;
      font-weight: 700;
      padding: 0.25rem 0;
      color: var(--ink);
    }
    .facts a {
      color: var(--moss);
      text-decoration-thickness: 1.5px;
      text-underline-offset: 3px;
    }

    .cta {
      display: inline-block;
      padding: 0.88rem 1.6rem;
      font-family: "Fraunces", Georgia, serif;
      font-weight: 700;
      font-size: 1.12rem;
      color: var(--cream);
      text-decoration: none;
      background: linear-gradient(180deg, #8a5a32, var(--bark) 48%, var(--bark-deep));
      border-radius: 999px;
      box-shadow: 0 4px 0 var(--bark-deep), 0 12px 24px rgba(20, 30, 10, 0.32);
      transition: transform 0.15s ease;
    }
    .cta:hover { transform: translateY(-2px); }

    .foot {
      margin-top: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }
    .foot img {
      width: 76px;
      height: 76px;
      padding: 0.28rem;
      background: rgba(255, 248, 232, 0.9);
      border: 1px solid rgba(90, 70, 40, 0.22);
      border-radius: 0.45rem;
    }
    .foot p {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--ink);
      text-align: left;
      line-height: 1.3;
    }

    @keyframes settle {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (min-width: 700px) {
      .tale { width: 400px; padding: 1.75rem 1.5rem 1.5rem; }
      .page { background-position: center 30%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tale { animation: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <article class="tale">
      <p class="chapter">A birthday tale from the jungle</p>
      <h1>
        Two Wild
        <em>to Handle</em>
      </h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="lede">
        Once upon a time, deep in the jungle, we gathered to celebrate our little explorer’s
        <strong>2nd birthday</strong>.
      </p>

      <ul class="facts">
        <li>Sunday, August 16th · 6:00 PM</li>
        <li>
          <a href="https://maps.google.com/?q=29715+Thistle+Ln,+New+Hudson,+MI+48165" target="_blank" rel="noopener">
            29715 Thistle Ln, New Hudson, MI
          </a>
        </li>
      </ul>

      <a class="cta" href="https://forms.gle/KUo29x73aF3Jy5Kw6" target="_blank" rel="noopener">
        RSVP to the adventure
      </a>

      <div class="foot">
        <img src="qr-rsvp.png?v=9" width="76" height="76" alt="QR code to RSVP" />
        <p>Scan to RSVP<br />Please reply by August 14th</p>
      </div>
    </article>
  </main>
</body>
</html>
