<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Two Wild to Handle — A Jungle Birthday Tale</title>
  <meta name="description" content="Once upon a time in the jungle… join us for our little explorer’s 2nd birthday. Sunday, August 16th at 6:00 PM." />
  <meta property="og:title" content="Two Wild to Handle — Jungle Birthday" />
  <meta property="og:description" content="Sunday, August 16th · 6:00 PM · New Hudson, MI" />
  <meta property="og:image" content="assets/jungle-storybook.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #2a2118;
      --moss: #3d5c34;
      --gold: #c4a35a;
      --cream: #f7efd8;
      --bark: #6b4226;
      --bark-deep: #3e2614;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: #1a2416;
    }

    body {
      font-family: "Nunito", Georgia, sans-serif;
      color: var(--ink);
    }

    /* One painted storybook page — full window */
    .page {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(0.75rem, 3vw, 1.5rem);
      background:
        radial-gradient(ellipse 90% 70% at 50% 40%, transparent 30%, rgba(10, 18, 8, 0.45) 100%),
        url("assets/jungle-storybook.jpg?v=7") center / cover no-repeat;
      overflow: hidden;
    }

    /* Soft storybook vignette + paper grain */
    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 70% 55% at 50% 48%, rgba(247, 239, 216, 0.12), transparent 65%),
        linear-gradient(180deg, rgba(20, 35, 15, 0.2), transparent 18%, transparent 78%, rgba(15, 25, 10, 0.35));
      z-index: 1;
    }

    .page::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.12;
      mix-blend-mode: soft-light;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      z-index: 1;
    }

    /* Text lives in the sunlit clearing */
    .tale {
      position: relative;
      z-index: 2;
      width: min(100%, 360px);
      text-align: center;
      padding: 1.35rem 1.2rem 1.4rem;
      background:
        linear-gradient(165deg, rgba(247, 239, 216, 0.82), rgba(236, 220, 180, 0.72));
      border: 1px solid rgba(107, 66, 38, 0.28);
      border-radius: 0.35rem;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.35) inset,
        0 18px 40px rgba(20, 30, 10, 0.35);
      backdrop-filter: blur(2px);
      animation: open 1.1s cubic-bezier(0.22, 0.9, 0.25, 1) both;
    }

    .chapter {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-size: 0.95rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--moss);
      margin-bottom: 0.55rem;
    }

    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 700;
      font-size: clamp(2.4rem, 10vw, 3rem);
      line-height: 0.95;
      color: var(--bark-deep);
      text-wrap: balance;
    }
    h1 em {
      display: block;
      font-style: italic;
      font-weight: 600;
      color: var(--moss);
      font-size: 0.92em;
      margin-top: 0.1rem;
    }

    .rule {
      width: 4.5rem;
      height: 2px;
      margin: 0.85rem auto;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .lede {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.28rem;
      line-height: 1.4;
      color: #3a3228;
      font-weight: 600;
    }
    .lede strong {
      color: var(--moss);
      font-weight: 700;
    }

    .facts {
      list-style: none;
      margin: 1rem 0 1.15rem;
      padding: 0.75rem 0.5rem;
      border-top: 1px solid rgba(107, 66, 38, 0.2);
      border-bottom: 1px solid rgba(107, 66, 38, 0.2);
      text-align: center;
    }
    .facts li {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.15rem;
      font-weight: 600;
      padding: 0.28rem 0;
      color: var(--ink);
    }
    .facts a {
      color: var(--moss);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .cta {
      display: inline-block;
      margin-top: 0.15rem;
      padding: 0.85rem 1.7rem;
      font-family: "Fraunces", Georgia, serif;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.03em;
      color: var(--cream);
      text-decoration: none;
      background: linear-gradient(180deg, #8a5a32, var(--bark) 45%, var(--bark-deep));
      border-radius: 999px;
      box-shadow: 0 4px 0 var(--bark-deep), 0 12px 24px rgba(40, 30, 15, 0.3);
      transition: transform 0.15s ease;
    }
    .cta:hover { transform: translateY(-2px); }
    .cta:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--bark-deep); }

    .footnote {
      margin-top: 0.9rem;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-size: 1.05rem;
      color: #5a4e40;
    }

    .qr {
      margin-top: 0.85rem;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
    }
    .qr img {
      width: 88px;
      height: 88px;
      padding: 0.3rem;
      background: rgba(255,255,255,0.85);
      border: 1px solid rgba(107, 66, 38, 0.25);
      border-radius: 0.35rem;
    }
    .qr span {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 0.95rem;
      color: var(--moss);
    }

    @keyframes open {
      from { opacity: 0; transform: translateY(14px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (min-width: 700px) {
      .tale { width: 400px; padding: 1.6rem 1.5rem 1.7rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tale { animation: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <article class="tale">
      <p class="chapter">A birthday tale from the jungle</p>
      <h1>
        Two Wild
        <em>to Handle</em>
      </h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="lede">
        Once upon a time, deep in the jungle, we gathered to celebrate our little explorer’s
        <strong>2nd birthday</strong>.
      </p>

      <ul class="facts">
        <li>Sunday, August 16th · 6:00 PM</li>
        <li>
          <a href="https://maps.google.com/?q=29715+Thistle+Ln,+New+Hudson,+MI+48165" target="_blank" rel="noopener">
            29715 Thistle Ln, New Hudson, MI
          </a>
        </li>
      </ul>

      <a class="cta" href="https://forms.gle/KUo29x73aF3Jy5Kw6" target="_blank" rel="noopener">
        RSVP to the adventure
      </a>

      <div class="qr">
        <img src="qr-rsvp.png?v=7" width="88" height="88" alt="QR code to RSVP" />
        <span>Scan to RSVP</span>
      </div>

      <p class="footnote">Please reply by August 14th</p>
    </article>
  </main>
</body>
</html>
