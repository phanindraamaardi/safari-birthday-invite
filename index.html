<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Two Wild to Handle — 2nd Birthday Safari</title>
  <meta name="description" content="Join our little explorer’s wild 2nd birthday safari — Sunday, August 16th at 6:00 PM." />
  <meta property="og:title" content="Two Wild to Handle — 2nd Birthday" />
  <meta property="og:description" content="Sunday, August 16th · 6:00 PM · New Hudson, MI" />
  <meta property="og:image" content="assets/lion.png?v=5" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Pacifico&family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sand: #f0dfb0;
      --sand2: #e2cb8e;
      --leaf: #2c7338;
      --leaf2: #4a9a42;
      --leaf3: #7fc85a;
      --canopy: #12351c;
      --wood: #9a5f2c;
      --wood2: #543110;
      --cream: #fff7e4;
      --ink: #1c3023;
      --sun: #e9a832;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: "Nunito", system-ui, sans-serif;
      color: var(--ink);
      background: #cbb57a;
      overflow-x: hidden;
    }

    .world {
      position: relative;
      min-height: 100vh;
      overflow: clip;
      background:
        radial-gradient(ellipse 110% 60% at 50% -8%, #c8e892 0%, transparent 52%),
        radial-gradient(ellipse 55% 45% at 0% 25%, rgba(74,154,66,.4), transparent 60%),
        radial-gradient(ellipse 55% 45% at 100% 45%, rgba(127,200,90,.35), transparent 55%),
        radial-gradient(ellipse 70% 40% at 50% 100%, rgba(84,49,16,.18), transparent 50%),
        linear-gradient(180deg, #dceeb0 0%, var(--sand) 30%, var(--sand2) 70%, #c4ae72 100%);
    }
    .world::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.22;
      z-index: 1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
    }
    /* warm light wash to unify animals with parchment */
    .world::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      background: radial-gradient(ellipse 80% 60% at 50% 40%, transparent 40%, rgba(90, 70, 30, 0.12) 100%);
      mix-blend-mode: multiply;
    }

    /* ===== DENSE ANIMAL FIELD (full page) ===== */
    .fauna {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }
    .fauna img {
      position: absolute;
      user-select: none;
      -webkit-user-drag: none;
      /* grounded, not sticker-bright */
      filter:
        drop-shadow(0 18px 16px rgba(40, 55, 20, 0.38))
        drop-shadow(0 2px 2px rgba(40, 55, 20, 0.2))
        saturate(0.88)
        contrast(0.96)
        brightness(0.97);
      mix-blend-mode: multiply;
      opacity: 0.92;
    }
    /* front-layer animals a bit clearer */
    .fauna img.front {
      z-index: 8;
      mix-blend-mode: normal;
      opacity: 1;
      filter:
        drop-shadow(0 14px 12px rgba(40, 55, 20, 0.42))
        saturate(0.92)
        contrast(0.98);
    }
    .fauna img.soft {
      opacity: 0.78;
      filter:
        drop-shadow(0 10px 10px rgba(40, 55, 20, 0.28))
        saturate(0.75)
        brightness(1.02)
        blur(0.2px);
      mix-blend-mode: multiply;
    }

    /* TOP */
    .a1 { top: -2%; left: -12%; width: clamp(130px, 38vw, 200px); animation: floaty 4s ease-in-out infinite; z-index: 4; }
    .a2 { top: -4%; right: -10%; width: clamp(140px, 40vw, 210px); transform-origin: 75% 8%; animation: swing 3.3s ease-in-out infinite; z-index: 5; }
    .a3 { top: 8%; left: 28%; width: clamp(70px, 18vw, 100px); animation: bob 3.8s .2s ease-in-out infinite; z-index: 2; }

    /* UPPER MID / SIDES */
    .a4 { top: 18%; left: -14%; width: clamp(110px, 32vw, 170px); animation: peekL 5s ease-in-out infinite; z-index: 3; }
    .a5 { top: 22%; right: -12%; width: clamp(100px, 30vw, 160px); animation: floaty 4.6s .3s ease-in-out infinite; z-index: 3; }
    .a6 { top: 32%; left: 8%; width: clamp(64px, 16vw, 90px); animation: bob 4.2s .5s ease-in-out infinite; z-index: 2; }

    /* MID PAGE around content */
    .a7 { top: 40%; left: -16%; width: clamp(120px, 34vw, 180px); animation: floaty 5s .1s ease-in-out infinite; z-index: 4; }
    .a8 { top: 42%; right: -14%; width: clamp(115px, 33vw, 175px); animation: floaty 4.4s .4s ease-in-out infinite; z-index: 4; }
    .a9 { top: 48%; left: 22%; width: clamp(55px, 14vw, 78px); animation: bob 3.5s .7s ease-in-out infinite; z-index: 2; }
    .a10 { top: 52%; right: 18%; width: clamp(60px, 15vw, 82px); animation: bob 3.9s .2s ease-in-out infinite; z-index: 2; }

    /* LOWER MID */
    .a11 { top: 58%; left: -10%; width: clamp(100px, 28vw, 150px); animation: peekL 4.8s .3s ease-in-out infinite; z-index: 3; }
    .a12 { top: 62%; right: -11%; width: clamp(125px, 36vw, 190px); animation: floaty 4.1s .55s ease-in-out infinite; z-index: 5; }
    .a13 { top: 68%; left: 30%; width: clamp(58px, 15vw, 80px); animation: bob 4.5s ease-in-out infinite; z-index: 2; }

    /* BOTTOM */
    .a14 { bottom: -2%; left: -14%; width: clamp(150px, 44vw, 230px); animation: floaty 4.3s .2s ease-in-out infinite; z-index: 6; }
    .a15 { bottom: -1%; right: -12%; width: clamp(145px, 42vw, 220px); animation: floaty 3.9s .45s ease-in-out infinite; z-index: 6; }
    .a16 { bottom: 10%; left: 20%; width: clamp(70px, 18vw, 100px); animation: bob 3.7s .6s ease-in-out infinite; z-index: 4; }
    .a17 { bottom: 14%; right: 22%; width: clamp(75px, 19vw, 105px); animation: bob 4s .15s ease-in-out infinite; z-index: 4; }
    .a18 { bottom: 28%; left: -8%; width: clamp(85px, 22vw, 120px); animation: peekL 5.2s .5s ease-in-out infinite; z-index: 3; }

    /* Dense foliage — above soft animals, under front animals & content */
    .foliage {
      position: absolute;
      inset: 0;
      z-index: 7;
      pointer-events: none;
      overflow: hidden;
    }
    .leaf {
      position: absolute;
      width: 82px;
      height: 108px;
      background: linear-gradient(150deg, var(--leaf3), var(--leaf) 50%, var(--canopy));
      border-radius: 10% 82% 14% 78%;
      transform-origin: 40% 10%;
      box-shadow:
        inset -10px -8px 0 rgba(0,0,0,0.16),
        0 8px 14px rgba(20, 50, 20, 0.2);
      animation: sway 4.4s ease-in-out infinite;
      opacity: 0.95;
    }
    .leaf::before {
      content: "";
      position: absolute;
      inset: 10% auto 10% 42%;
      width: 3px;
      background: rgba(255,255,255,0.18);
      border-radius: 2px;
    }
    .leaf::after {
      content: "";
      position: absolute;
      inset: 18% 48% 14% 42%;
      background: rgba(255,255,255,0.16);
      border-radius: 40%;
    }
    .leaf.big { width: 118px; height: 150px; }
    .leaf.dark { background: linear-gradient(150deg, var(--leaf2), var(--canopy) 70%); }
    .leaf.round {
      width: 96px;
      height: 96px;
      border-radius: 44% 56% 48% 52%;
    }
    .leaf.tiny { width: 48px; height: 64px; opacity: 0.85; }

    .vine {
      position: absolute;
      width: 6px;
      height: 120px;
      background: linear-gradient(180deg, var(--leaf2), var(--canopy));
      border-radius: 6px;
      transform-origin: top center;
      animation: sway 3.8s ease-in-out infinite;
      box-shadow: 2px 0 0 rgba(0,0,0,0.12);
    }

    .bunting {
      position: relative;
      z-index: 12;
      display: flex;
      justify-content: center;
      gap: 0.32rem;
      padding: 1.05rem 0 0;
    }
    .bunting span {
      width: 1.55rem;
      height: 2rem;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      animation: flutter 2.7s ease-in-out infinite;
    }
    .bunting span:nth-child(odd) { background: var(--leaf2); }
    .bunting span:nth-child(even) { background: var(--sun); }
    .bunting span:nth-child(3n) { background: var(--canopy); }

    .stage {
      position: relative;
      z-index: 12;
      max-width: 340px;
      margin: 0 auto;
      padding: 0.2rem 1rem 2.75rem;
      text-align: center;
    }

    .brand { animation: pop 0.85s cubic-bezier(.2,.9,.2,1) both; }
    .brand .two {
      display: block;
      font-family: "Baloo 2", cursive;
      font-weight: 800;
      font-size: clamp(2.7rem, 12.5vw, 3.5rem);
      line-height: 0.9;
      color: var(--canopy);
      -webkit-text-stroke: 4px #fff;
      paint-order: stroke fill;
      text-shadow: 0 4px 0 rgba(18, 53, 28, 0.22);
    }
    .brand .wild {
      display: block;
      font-family: "Pacifico", cursive;
      font-size: clamp(2.8rem, 13.5vw, 3.7rem);
      line-height: 1;
      color: #1a3d68;
      -webkit-text-stroke: 3px #fff;
      paint-order: stroke fill;
      animation: bob 3.2s ease-in-out infinite;
    }
    .brand .plank {
      display: inline-block;
      margin-top: 0.28rem;
      padding: 0.32rem 1.05rem 0.42rem;
      font-family: "Baloo 2", cursive;
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--cream);
      background: linear-gradient(180deg, #b87336, var(--wood) 48%, var(--wood2));
      border-radius: 0.35rem;
      box-shadow: 0 4px 0 var(--wood2), 0 10px 18px rgba(84, 49, 16, 0.28);
      transform: rotate(-2deg);
      animation: wiggle 5s ease-in-out infinite;
    }

    .lede {
      margin: 0.85rem auto 0;
      max-width: 18.5rem;
      font-size: 1.02rem;
      font-weight: 700;
      line-height: 1.4;
      color: #334f3a;
      text-shadow: 0 1px 0 rgba(255,247,228,0.7);
      animation: rise 0.8s 0.1s ease both;
    }
    .lede strong { color: var(--leaf); font-weight: 800; }

    .sign {
      display: block;
      width: 104px;
      margin: 0.8rem auto 0.45rem;
      filter: drop-shadow(0 8px 10px rgba(0,0,0,0.22));
      animation: floaty 4.5s ease-in-out infinite;
    }

    .details {
      margin: 0.65rem auto 1.15rem;
      padding: 0.85rem 0.95rem;
      text-align: left;
      background: rgba(255, 247, 228, 0.78);
      border: 2.5px dashed rgba(44, 115, 56, 0.5);
      border-radius: 1.1rem;
      backdrop-filter: blur(4px);
      box-shadow: 0 12px 26px rgba(40, 60, 20, 0.14);
      animation: rise 0.85s 0.22s ease both;
    }
    .details li {
      list-style: none;
      display: grid;
      grid-template-columns: 1.55rem 1fr;
      gap: 0.48rem;
      align-items: center;
      padding: 0.42rem 0;
      font-weight: 800;
      font-size: 0.96rem;
    }
    .details li + li { border-top: 1px solid rgba(44,115,56,0.14); }
    .details a {
      color: var(--leaf);
      text-decoration-thickness: 2px;
      text-underline-offset: 2px;
    }

    .rsvp { animation: rise 0.9s 0.32s ease both; }
    .rsvp h2 {
      display: inline-block;
      font-family: "Baloo 2", cursive;
      font-size: 1.45rem;
      color: var(--cream);
      background: linear-gradient(180deg, #b87336, var(--wood) 50%, var(--wood2));
      padding: 0.3rem 1.2rem 0.4rem;
      border-radius: 0.35rem;
      box-shadow: 0 3px 0 var(--wood2);
      transform: rotate(-1.5deg);
      margin-bottom: 0.45rem;
    }
    .rsvp p {
      font-weight: 700;
      color: #3a5342;
      margin-bottom: 0.8rem;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      min-width: 14rem;
      padding: 1rem 1.55rem;
      border-radius: 999px;
      text-decoration: none;
      color: #fff;
      font-family: "Baloo 2", cursive;
      font-weight: 800;
      font-size: 1.32rem;
      background: linear-gradient(180deg, #5eb84e, var(--leaf2) 45%, var(--leaf) 80%, var(--canopy));
      box-shadow: 0 6px 0 #0f2f16, 0 16px 28px rgba(18,53,28,.35);
      animation: pulse 2.1s ease-in-out infinite;
    }
    .cta:hover { transform: translateY(-3px) scale(1.04); animation: none; }

    .qr {
      margin-top: 1rem;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 0.28rem;
    }
    .qr img {
      width: 108px;
      height: 108px;
      padding: 0.32rem;
      background: var(--cream);
      border: 4px solid rgba(127, 200, 90, 0.8);
      border-radius: 0.95rem;
      box-shadow: 0 8px 16px rgba(40,60,20,0.18);
    }
    .qr span {
      font-family: "Baloo 2", cursive;
      font-weight: 700;
      color: var(--canopy);
    }
    .deadline {
      margin-top: 0.8rem;
      font-weight: 700;
      font-size: 0.86rem;
      color: #5a7260;
    }

    .spark {
      position: absolute;
      width: 13px;
      height: 13px;
      background: var(--sun);
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      animation: twinkle 2.6s ease-in-out infinite;
      z-index: 11;
      pointer-events: none;
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-11deg); }
      50% { transform: rotate(13deg); }
    }
    @keyframes flutter {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(9deg); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2.5deg); }
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-11px); }
    }
    @keyframes swing {
      0%, 100% { transform: rotate(-13deg); }
      50% { transform: rotate(15deg); }
    }
    @keyframes peekL {
      0%, 100% { transform: translateX(0) rotate(-5deg); }
      50% { transform: translateX(16px) rotate(3deg); }
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 6px 0 #0f2f16, 0 16px 28px rgba(18,53,28,.35), 0 0 0 0 rgba(127,200,90,.3); }
      50% { box-shadow: 0 6px 0 #0f2f16, 0 16px 32px rgba(18,53,28,.45), 0 0 0 12px rgba(127,200,90,.12); }
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.9) translateY(14px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.7); }
      50% { opacity: 1; transform: scale(1.2) rotate(18deg); }
    }

    @media (min-width: 640px) {
      .stage { max-width: 380px; }
      .a1 { left: 0; }
      .a2 { right: 0; }
      .a4 { left: -2%; }
      .a5 { right: -2%; }
      .a7 { left: 0; }
      .a8 { right: 0; }
      .a14 { left: 0; }
      .a15 { right: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="world">
    <!-- Dense fauna across the FULL viewport -->
    <div class="fauna" aria-hidden="true">
      <!-- top -->
      <img class="a1 front" src="assets/lion.png?v=5" alt="" />
      <img class="a2 front" src="assets/monkey.png?v=5" alt="" />
      <img class="a3 soft" src="assets/elephant.png?v=5" alt="" />
      <!-- upper -->
      <img class="a4" src="assets/zebra.png?v=5" alt="" />
      <img class="a5" src="assets/giraffe.png?v=5" alt="" />
      <img class="a6 soft" src="assets/monkey.png?v=5" alt="" />
      <!-- mid -->
      <img class="a7" src="assets/lion.png?v=5" alt="" />
      <img class="a8" src="assets/elephant.png?v=5" alt="" />
      <img class="a9 soft" src="assets/giraffe.png?v=5" alt="" />
      <img class="a10 soft" src="assets/zebra.png?v=5" alt="" />
      <!-- lower mid -->
      <img class="a11" src="assets/monkey.png?v=5" alt="" />
      <img class="a12 front" src="assets/giraffe.png?v=5" alt="" />
      <img class="a13 soft" src="assets/lion.png?v=5" alt="" />
      <!-- bottom -->
      <img class="a14 front" src="assets/zebra.png?v=5" alt="" />
      <img class="a15 front" src="assets/elephant.png?v=5" alt="" />
      <img class="a16" src="assets/lion.png?v=5" alt="" />
      <img class="a17" src="assets/monkey.png?v=5" alt="" />
      <img class="a18 soft" src="assets/elephant.png?v=5" alt="" />
    </div>

    <!-- Foliage overlaps animals for depth -->
    <div class="foliage" aria-hidden="true">
      <span class="vine" style="left:12%; top:-10px; height:140px; animation-delay:.2s"></span>
      <span class="vine" style="right:16%; top:-8px; height:160px; animation-delay:.5s"></span>
      <span class="leaf big dark" style="left:-30px;top:-36px"></span>
      <span class="leaf round" style="left:42px;top:-20px;animation-delay:.3s"></span>
      <span class="leaf" style="left:110px;top:-40px;animation-delay:.6s"></span>
      <span class="leaf big" style="left:190px;top:-24px;animation-delay:.15s"></span>
      <span class="leaf dark round" style="right:160px;top:-30px;animation-delay:.45s"></span>
      <span class="leaf" style="right:80px;top:-16px;animation-delay:.75s"></span>
      <span class="leaf big dark" style="right:-18px;top:-34px;animation-delay:.1s"></span>
      <span class="leaf tiny" style="left:8%;top:16%;animation-delay:.4s"></span>
      <span class="leaf dark" style="left:-20px;top:28%;animation-delay:.55s"></span>
      <span class="leaf round" style="right:-22px;top:30%;animation-delay:.35s"></span>
      <span class="leaf big" style="left:-28px;top:46%;animation-delay:.7s"></span>
      <span class="leaf dark round" style="right:-26px;top:50%;animation-delay:.25s"></span>
      <span class="leaf tiny" style="right:10%;top:38%;animation-delay:.9s"></span>
      <span class="leaf" style="left:6%;top:62%;animation-delay:.5s"></span>
      <span class="leaf big dark" style="right:4%;top:66%;animation-delay:.65s"></span>
      <span class="leaf big dark" style="left:-32px;bottom:-44px;animation-delay:.2s"></span>
      <span class="leaf round" style="left:60px;bottom:-30px;animation-delay:.5s"></span>
      <span class="leaf" style="left:140px;bottom:-48px;animation-delay:.15s"></span>
      <span class="leaf big" style="right:130px;bottom:-34px;animation-delay:.6s"></span>
      <span class="leaf dark round" style="right:40px;bottom:-24px;animation-delay:.4s"></span>
      <span class="leaf big dark" style="right:-30px;bottom:-42px;animation-delay:.85s"></span>
      <span class="leaf tiny" style="left:40%;bottom:8%;animation-delay:.3s"></span>
    </div>

    <span class="spark" style="left:46%; top:16%"></span>
    <span class="spark" style="left:56%; top:34%; animation-delay:.7s"></span>
    <span class="spark" style="left:42%; top:56%; animation-delay:1.15s"></span>
    <span class="spark" style="left:52%; top:74%; animation-delay:.4s"></span>

    <div class="bunting" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>

    <main class="stage">
      <header class="brand">
        <span class="two">Two</span>
        <span class="wild">Wild</span>
        <span class="plank">to Handle</span>
      </header>

      <p class="lede">
        Join us for a wild celebration as we party for our little explorer’s
        <strong>2nd Birthday!</strong>
      </p>

      <svg class="sign" viewBox="0 0 120 140" aria-hidden="true">
        <rect x="54" y="18" width="12" height="112" rx="3" fill="#6a3d14"/>
        <g transform="rotate(-6 60 40)">
          <rect x="18" y="28" width="84" height="22" rx="3" fill="#a2652e"/>
          <text x="60" y="44" text-anchor="middle" fill="#fff7e4" font-family="Baloo 2, sans-serif" font-size="11" font-weight="700">LET THE</text>
        </g>
        <g transform="rotate(4 60 65)">
          <rect x="12" y="54" width="96" height="22" rx="3" fill="#8b5526"/>
          <text x="60" y="70" text-anchor="middle" fill="#fff7e4" font-family="Baloo 2, sans-serif" font-size="11" font-weight="700">ADVENTURE</text>
        </g>
        <g transform="rotate(-3 60 90)">
          <rect x="22" y="80" width="76" height="22" rx="3" fill="#a2652e"/>
          <text x="60" y="96" text-anchor="middle" fill="#fff7e4" font-family="Baloo 2, sans-serif" font-size="11" font-weight="700">BEGIN!</text>
        </g>
      </svg>
