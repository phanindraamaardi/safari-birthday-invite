<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Two Wild to Handle — 2nd Birthday Safari</title>
  <meta name="description" content="Join our little explorer’s wild 2nd birthday safari — Sunday, August 16th at 6:00 PM." />
  <meta property="og:title" content="Two Wild to Handle — 2nd Birthday" />
  <meta property="og:description" content="Sunday, August 16th · 6:00 PM · New Hudson, MI" />
  <meta property="og:image" content="assets/lion.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Pacifico&family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sand: #f4e4b8;
      --sand2: #e6cf96;
      --leaf: #2f7a3a;
      --leaf2: #4fa344;
      --leaf3: #8fd45c;
      --canopy: #153f22;
      --wood: #a2652e;
      --wood2: #5c3512;
      --cream: #fff8e7;
      --ink: #1e3225;
      --sun: #f0b43a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: "Nunito", system-ui, sans-serif;
      color: var(--ink);
      background: #d9c48a;
      overflow-x: hidden;
    }

    .world {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(ellipse 100% 55% at 50% 0%, #cfe99a 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 0% 30%, rgba(79,163,68,.35), transparent 60%),
        radial-gradient(ellipse 60% 40% at 100% 55%, rgba(143,212,92,.3), transparent 55%),
        linear-gradient(180deg, #e5f3c0 0%, var(--sand) 32%, var(--sand2) 78%, #cbb57a 100%);
    }
    .world::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.2;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
      z-index: 0;
    }

    /* ===== ANIMALS PINNED TO FULL PAGE ===== */
    .critters {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    .critters img {
      position: absolute;
      filter: drop-shadow(0 14px 16px rgba(30, 50, 20, 0.35));
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Lion — top left, big, peeking in */
    .c-lion {
      top: 6%;
      left: -8%;
      width: clamp(150px, 42vw, 220px);
      animation: floaty 3.6s ease-in-out infinite;
      z-index: 3;
    }

    /* Monkey — top right, swinging from canopy */
    .c-monkey {
      top: -2%;
      right: -6%;
      width: clamp(140px, 40vw, 210px);
      transform-origin: 80% 5%;
      animation: swing 3.2s ease-in-out infinite;
      z-index: 4;
    }

    /* Giraffe — right edge, tall neck peeking */
    .c-giraffe {
      top: 28%;
      right: -10%;
      width: clamp(120px, 34vw, 180px);
      animation: floaty 4.8s 0.2s ease-in-out infinite;
      z-index: 2;
    }

    /* Zebra — bottom left in bushes */
    .c-zebra {
      bottom: 2%;
      left: -10%;
      width: clamp(160px, 46vw, 240px);
      animation: floaty 4.2s 0.4s ease-in-out infinite;
      z-index: 3;
    }

    /* Elephant — bottom right */
    .c-elephant {
      bottom: 1%;
      right: -8%;
      width: clamp(150px, 44vw, 230px);
      animation: floaty 3.9s 0.55s ease-in-out infinite;
      z-index: 3;
    }

    /* Extra smaller peeks so page feels full */
    .c-lion-sm {
      top: 48%;
      left: -12%;
      width: clamp(90px, 26vw, 130px);
      opacity: 0.95;
      animation: peek-left 5s ease-in-out infinite;
      z-index: 1;
    }
    .c-monkey-sm {
      bottom: 22%;
      right: -8%;
      width: clamp(85px, 24vw, 120px);
      animation: bob 3.5s ease-in-out infinite;
      z-index: 1;
    }

    /* Dense foliage frame */
    .foliage {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      overflow: hidden;
    }
    .leaf {
      position: absolute;
      width: 78px;
      height: 100px;
      background: linear-gradient(145deg, var(--leaf3), var(--leaf) 55%, var(--canopy));
      border-radius: 8% 80% 12% 78%;
      transform-origin: top center;
      box-shadow: inset -8px -6px 0 rgba(0,0,0,0.14);
      animation: sway 4.2s ease-in-out infinite;
    }
    .leaf::after {
      content: "";
      position: absolute;
      inset: 16% 46% 14% 48%;
      background: rgba(255,255,255,0.22);
      border-radius: 40%;
    }
    .leaf.big { width: 110px; height: 140px; }
    .leaf.dark { background: linear-gradient(145deg, var(--leaf2), var(--canopy)); }
    .leaf.round {
      width: 92px;
      height: 92px;
      border-radius: 42% 58% 48% 52%;
    }

    .bunting {
      position: relative;
      z-index: 6;
      display: flex;
      justify-content: center;
      gap: 0.35rem;
      padding: 1.15rem 0 0;
    }
    .bunting span {
      width: 1.65rem;
      height: 2.1rem;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      animation: flutter 2.6s ease-in-out infinite;
    }
    .bunting span:nth-child(odd) { background: var(--leaf2); }
    .bunting span:nth-child(even) { background: var(--sun); }
    .bunting span:nth-child(3n) { background: var(--canopy); }

    /* Center content — animals wrap around it */
    .stage {
      position: relative;
      z-index: 7;
      max-width: 360px;
      margin: 0 auto;
      padding: 0.35rem 1.1rem 2.5rem;
      text-align: center;
    }

    .brand { animation: pop 0.85s cubic-bezier(.2,.9,.2,1) both; }
    .brand .two {
      display: block;
      font-family: "Baloo 2", cursive;
      font-weight: 800;
      font-size: clamp(2.8rem, 13vw, 3.6rem);
      line-height: 0.9;
      color: var(--canopy);
      -webkit-text-stroke: 4px #fff;
      paint-order: stroke fill;
      text-shadow: 0 4px 0 rgba(21, 63, 34, 0.2);
    }
    .brand .wild {
      display: block;
      font-family: "Pacifico", cursive;
      font-size: clamp(2.9rem, 14vw, 3.8rem);
      line-height: 1;
      color: #1b3f6e;
      -webkit-text-stroke: 3px #fff;
      paint-order: stroke fill;
      animation: bob 3.2s ease-in-out infinite;
    }
    .brand .plank {
      display: inline-block;
      margin-top: 0.3rem;
      padding: 0.35rem 1.1rem 0.45rem;
      font-family: "Baloo 2", cursive;
      font-weight: 800;
      font-size: 1.3rem;
      color: var(--cream);
      background: linear-gradient(180deg, #c07a3a, var(--wood) 48%, var(--wood2));
      border-radius: 0.4rem;
      box-shadow: 0 4px 0 var(--wood2), 0 10px 18px rgba(92, 53, 18, 0.28);
      transform: rotate(-2deg);
      animation: wiggle 5s ease-in-out infinite;
    }

    .lede {
      margin: 0.9rem auto 0;
      max-width: 19rem;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.4;
      color: #35553c;
      animation: rise 0.8s 0.12s ease both;
    }
    .lede strong { color: var(--leaf); font-weight: 800; }

    .sign {
      display: block;
      width: 110px;
      margin: 0.85rem auto 0.5rem;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.18));
      animation: floaty 4.5s ease-in-out infinite;
    }

    .details {
      margin: 0.7rem auto 1.25rem;
      padding: 0.9rem 1rem;
      text-align: left;
      background: rgba(255, 248, 231, 0.72);
      border: 2.5px dashed rgba(47, 122, 58, 0.5);
      border-radius: 1.15rem;
      backdrop-filter: blur(3px);
      box-shadow: 0 10px 24px rgba(40, 60, 20, 0.12);
      animation: rise 0.85s 0.25s ease both;
    }
    .details li {
      list-style: none;
      display: grid;
      grid-template-columns: 1.6rem 1fr;
      gap: 0.5rem;
      align-items: center;
      padding: 0.45rem 0;
      font-weight: 800;
      font-size: 0.98rem;
    }
    .details li + li { border-top: 1px solid rgba(47,122,58,0.14); }
    .details a {
      color: var(--leaf);
      text-decoration-thickness: 2px;
      text-underline-offset: 2px;
    }

    .rsvp { animation: rise 0.9s 0.35s ease both; }
    .rsvp h2 {
      display: inline-block;
      font-family: "Baloo 2", cursive;
      font-size: 1.5rem;
      color: var(--cream);
      background: linear-gradient(180deg, #c07a3a, var(--wood) 50%, var(--wood2));
      padding: 0.32rem 1.25rem 0.42rem;
      border-radius: 0.4rem;
      box-shadow: 0 3px 0 var(--wood2);
      transform: rotate(-1.5deg);
      margin-bottom: 0.5rem;
    }
    .rsvp p {
      font-weight: 700;
      color: #3d5644;
      margin-bottom: 0.85rem;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      min-width: 14.5rem;
      padding: 1.05rem 1.6rem;
      border-radius: 999px;
      text-decoration: none;
      color: #fff;
      font-family: "Baloo 2", cursive;
      font-weight: 800;
      font-size: 1.35rem;
      background: linear-gradient(180deg, #63bd52, var(--leaf2) 45%, var(--leaf) 80%, var(--canopy));
      box-shadow: 0 6px 0 #12351a, 0 16px 30px rgba(24,72,35,.35);
      animation: pulse 2.1s ease-in-out infinite;
    }
    .cta:hover { transform: translateY(-3px) scale(1.04); animation: none; }

    .qr {
      margin-top: 1.05rem;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }
    .qr img {
      width: 112px;
      height: 112px;
      padding: 0.35rem;
      background: var(--cream);
      border: 4px solid rgba(143, 212, 92, 0.8);
      border-radius: 1rem;
    }
    .qr span {
      font-family: "Baloo 2", cursive;
      font-weight: 700;
      color: var(--canopy);
    }
    .deadline {
      margin-top: 0.85rem;
      font-weight: 700;
      font-size: 0.88rem;
      color: #5a7260;
    }

    .spark {
      position: absolute;
      width: 14px;
      height: 14px;
      background: var(--sun);
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      animation: twinkle 2.6s ease-in-out infinite;
      z-index: 6;
      pointer-events: none;
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(12deg); }
    }
    @keyframes flutter {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(9deg); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2.5deg); }
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    @keyframes swing {
      0%, 100% { transform: rotate(-12deg); }
      50% { transform: rotate(14deg); }
    }
    @keyframes peek-left {
      0%, 100% { transform: translateX(0) rotate(-6deg); }
      50% { transform: translateX(14px) rotate(4deg); }
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 6px 0 #12351a, 0 16px 30px rgba(24,72,35,.35), 0 0 0 0 rgba(143,212,92,.35); }
      50% { box-shadow: 0 6px 0 #12351a, 0 16px 34px rgba(24,72,35,.45), 0 0 0 14px rgba(143,212,92,.12); }
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.88) translateY(16px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.7); }
      50% { opacity: 1; transform: scale(1.2) rotate(20deg); }
    }

    @media (min-width: 600px) {
      .stage { max-width: 400px; padding-top: 0.5rem; }
      .c-lion { left: 2%; width: 200px; }
      .c-monkey { right: 2%; width: 190px; }
      .c-giraffe { right: 0; width: 170px; }
      .c-zebra { left: 0; width: 220px; }
      .c-elephant { right: 2%; width: 210px; }
      .c-lion-sm { left: 0; }
      .c-monkey-sm { right: 4%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="world">
    <!-- Animals cover the FULL page edges -->
    <div class="critters" aria-hidden="true">
      <img class="c-lion" src="assets/lion.png?v=4" alt="" />
      <img class="c-monkey" src="assets/monkey.png?v=4" alt="" />
      <img class="c-giraffe" src="assets/giraffe.png?v=4" alt="" />
      <img class="c-zebra" src="assets/zebra.png?v=4" alt="" />
      <img class="c-elephant" src="assets/elephant.png?v=4" alt="" />
      <img class="c-lion-sm" src="assets/lion.png?v=4" alt="" />
      <img class="c-monkey-sm" src="assets/monkey.png?v=4" alt="" />
    </div>

    <div class="foliage" aria-hidden="true">
      <span class="leaf big dark" style="left:-24px;top:-30px"></span>
      <span class="leaf round" style="left:48px;top:-18px;animation-delay:.3s"></span>
      <span class="leaf" style="left:120px;top:-36px;animation-delay:.6s"></span>
      <span class="leaf big" style="left:200px;top:-22px;animation-delay:.2s"></span>
      <span class="leaf dark round" style="right:170px;top:-28px;animation-delay:.5s"></span>
      <span class="leaf" style="right:90px;top:-14px;animation-delay:.8s"></span>
      <span class="leaf big dark" style="right:-10px;top:-32px;animation-delay:.1s"></span>
      <span class="leaf round" style="right:40px;top:40px;animation-delay:.4s"></span>
      <span class="leaf dark" style="left:-16px;top:42%;animation-delay:.7s"></span>
      <span class="leaf big" style="right:-20px;top:55%;animation-delay:.35s"></span>
      <span class="leaf big dark" style="left:-28px;bottom:-40px;animation-delay:.25s"></span>
      <span class="leaf round" style="left:70px;bottom:-28px;animation-delay:.55s"></span>
      <span class="leaf" style="left:150px;bottom:-44px;animation-delay:.15s"></span>
      <span class="leaf big" style="right:140px;bottom:-30px;animation-delay:.65s"></span>
      <span class="leaf dark round" style="right:50px;bottom:-22px;animation-delay:.4s"></span>
      <span class="leaf big dark" style="right:-26px;bottom:-38px;animation-delay:.9s"></span>
    </div>

    <span class="spark" style="left:46%; top:18%"></span>
    <span class="spark" style="left:58%; top:36%; animation-delay:.7s"></span>
    <span class="spark" style="left:40%; top:58%; animation-delay:1.2s"></span>

    <div class="bunting" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>

    <main class="stage">
      <header class="brand">
        <span class="two">Two</span>
        <span class="wild">Wild</span>
        <span class="plank">to Handle</span>
      </header>

      <p class="lede">
        Join us for a wild celebration as we party for our little explorer’s
        <strong>2nd Birthday!</strong>
      </p>

      <svg class="sign" viewBox="0 0 120 140" aria-hidden="true">
        <rect x="54" y="18" width="12" height="112" rx="3" fill="#6a3d14"/>
        <g transform="rotate(-6 60 40)">
          <rect x="18" y="28" width="84" height="22" rx="3" fill="#a2652e"/>
          <text x="60" y="44" text-anchor="middle" fill="#fff8e7" font-family="Baloo 2, sans-serif" font-size="11" font-weight="700">LET THE</text>
        </g>
        <g transform="rotate(4 60 65)">
          <rect x="12" y="54" width="96" height="22" rx="3" fill="#8b5526"/>
          <text x="60" y="70" text-anchor="middle" fill="#fff8e7" font-family="Baloo 2, sans-serif" font-size="11" font-weight="700">ADVENTURE</text>
        </g>
        <g transform="rotate(-3 60 90)">
          <rect x="22" y="80" width="76" height="22" rx="3" fill="#a2652e"/>
          <text x="60" y="96" text-anchor="middle" fill="#fff8e7" font-family="Baloo 2, sans-serif" font-size="11" font-weight="700">BEGIN!</text>
        </g>
      </svg>

      <ul class="details">
        <li>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" stroke="#2f7a3a" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="#2f7a3a" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Sunday, August 16th</span>
        </li>
        <li>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="#2f7a3a" stroke-width="2"/><path d="M12 7v6l4 2" stroke="#2f7a3a" stroke-width="2" stroke-linecap="round"/></svg>
          <span>6:00 PM</span>
        </li>
        <li>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s7-5.2 7-11a7 7 0 1 0-14 0c0 5.8 7 11 7 11z" stroke="#2f7a3a" stroke-width="2"/><circle cx="12" cy="10" r="2.5" stroke="#2f7a3a" stroke-width="2"/></svg>
          <a href="https://maps.google.com/?q=29715+Thistle+Ln,+New+Hudson,+MI+48165" target="_blank" rel="noopener">
            29715 Thistle Ln, New Hudson, MI 48165
          </a>
        </li>
      </ul>

      <section class="rsvp" id="rsvp">
        <h2>RSVP</h2>
        <p>Can you join the adventure? Tap below to RSVP!</p>
        <a class="cta" href="https://forms.gle/KUo29x73aF3Jy5Kw6" target="_blank" rel="noopener">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <circle cx="6" cy="7" r="2.2"/><circle cx="12" cy="5" r="2.2"/><circle cx="18" cy="7" r="2.2"/>
            <ellipse cx="12" cy="15.5" rx="6" ry="5"/>
          </svg>
          RSVP Now
        </a>
        <div class="qr">
          <img src="qr-rsvp.png?v=4" width="112" height="112" alt="QR code to RSVP" />
          <span>Scan to RSVP</span>
        </div>
        <p class="deadline">Please RSVP by August 14th</p>
      </section>
    </main>
  </div>
</body>
</html>
