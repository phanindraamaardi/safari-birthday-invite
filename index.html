<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Two Wild to Handle — 2nd Birthday Safari</title>
  <meta name="description" content="Join our little explorer’s wild 2nd birthday safari — Sunday, August 16th at 6:00 PM." />
  <meta property="og:title" content="Two Wild to Handle — 2nd Birthday" />
  <meta property="og:description" content="Sunday, August 16th · 6:00 PM · New Hudson, MI" />
  <meta property="og:image" content="assets/lion.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Pacifico&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sand: #f6e7c4;
      --sand2: #edd9a8;
      --leaf: #2f7a3a;
      --leaf2: #57a84a;
      --leaf3: #8fd45c;
      --canopy: #184823;
      --wood: #a2652e;
      --wood2: #6a3d14;
      --cream: #fff8e7;
      --ink: #1e3225;
      --sun: #f0b43a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      font-family: "Nunito", system-ui, sans-serif;
      color: var(--ink);
      background: var(--sand);
      overflow-x: hidden;
    }

    /* Full-page parchment + savanna wash */
    .world {
      position: relative;
      min-height: 100vh;
      padding: 0 0 2.5rem;
      background:
        radial-gradient(ellipse 120% 70% at 50% -5%, #d9efb0 0%, transparent 55%),
        radial-gradient(ellipse 80% 50% at 100% 40%, rgba(143, 212, 92, 0.28), transparent 50%),
        radial-gradient(ellipse 70% 45% at 0% 60%, rgba(87, 168, 74, 0.22), transparent 50%),
        linear-gradient(180deg, #eaf6cf 0%, var(--sand) 28%, var(--sand2) 72%, #d9c48a 100%);
    }
    .world::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
    }

    /* Edge-to-edge jungle canopy */
    .canopy, .undergrowth {
      position: absolute;
      left: 0;
      right: 0;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }
    .canopy { top: 0; height: 150px; }
    .undergrowth { bottom: 0; height: 170px; }

    .leaf {
      position: absolute;
      width: 70px;
      height: 90px;
      background: linear-gradient(145deg, var(--leaf3), var(--leaf) 55%, var(--canopy));
      border-radius: 5% 80% 10% 80%;
      transform-origin: top center;
      box-shadow: inset -8px -6px 0 rgba(0,0,0,0.12);
      animation: sway 4.5s ease-in-out infinite;
      opacity: 0.95;
    }
    .leaf::after {
      content: "";
      position: absolute;
      inset: 18% 46% 12% 48%;
      background: rgba(255,255,255,0.22);
      border-radius: 40%;
    }
    .leaf.big { width: 96px; height: 120px; }
    .leaf.dark { background: linear-gradient(145deg, var(--leaf2), var(--canopy)); }
    .leaf.round {
      width: 84px;
      height: 84px;
      border-radius: 42% 58% 48% 52%;
    }

    /* Bunting */
    .bunting {
      position: relative;
      z-index: 6;
      display: flex;
      justify-content: center;
      gap: 0.4rem;
      padding-top: 1.1rem;
      margin-bottom: 0.25rem;
    }
    .bunting span {
      width: 1.7rem;
      height: 2.15rem;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      animation: flutter 2.8s ease-in-out infinite;
      transform-origin: top center;
    }
    .bunting span:nth-child(odd) { background: var(--leaf2); }
    .bunting span:nth-child(even) { background: var(--sun); }
    .bunting span:nth-child(3n) { background: var(--canopy); }
    .bunting span:nth-child(1) { animation-delay: 0s; }
    .bunting span:nth-child(2) { animation-delay: .12s; }
    .bunting span:nth-child(3) { animation-delay: .24s; }
    .bunting span:nth-child(4) { animation-delay: .36s; }
    .bunting span:nth-child(5) { animation-delay: .48s; }
    .bunting span:nth-child(6) { animation-delay: .6s; }
    .bunting span:nth-child(7) { animation-delay: .72s; }
    .bunting span:nth-child(8) { animation-delay: .84s; }
    .bunting span:nth-child(9) { animation-delay: .96s; }

    .stage {
      position: relative;
      z-index: 4;
      max-width: 440px;
      margin: 0 auto;
      padding: 0.5rem 1rem 8.5rem;
      text-align: center;
    }

    /* Title */
    .brand {
      position: relative;
      margin-top: 0.4rem;
      animation: pop 0.9s cubic-bezier(.2,.9,.2,1) both;
    }
    .brand .two {
      display: block;
      font-family: "Baloo 2", cursive;
      font-weight: 800;
      font-size: clamp(3rem, 14vw, 3.8rem);
      line-height: 0.9;
      color: var(--canopy);
      -webkit-text-stroke: 4px #fff;
      paint-order: stroke fill;
      text-shadow: 0 4px 0 rgba(24, 72, 35, 0.2);
    }
    .brand .wild {
      display: block;
      font-family: "Pacifico", cursive;
      font-size: clamp(3.1rem, 15vw, 4rem);
      line-height: 1;
      color: #1b3f6e;
      -webkit-text-stroke: 3px #fff;
      paint-order: stroke fill;
      text-shadow: 0 5px 0 rgba(27, 63, 110, 0.18);
      animation: bob 3.2s ease-in-out infinite;
    }
    .brand .plank {
      display: inline-block;
      margin-top: 0.35rem;
      padding: 0.35rem 1.15rem 0.45rem;
      font-family: "Baloo 2", cursive;
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: 0.03em;
      color: var(--cream);
      background: linear-gradient(180deg, #c07a3a, var(--wood) 45%, var(--wood2));
      border-radius: 0.4rem;
      box-shadow: 0 4px 0 var(--wood2), 0 10px 20px rgba(106, 61, 20, 0.25);
      transform: rotate(-2deg);
      animation: wiggle 5s ease-in-out infinite;
    }

    .lede {
      margin: 1rem auto 0;
      max-width: 21rem;
      font-size: 1.08rem;
      font-weight: 700;
      line-height: 1.45;
      color: #35553c;
      animation: rise 0.8s 0.15s ease both;
    }
    .lede strong {
      color: var(--leaf);
      font-weight: 800;
    }

    /* Animal playground */
    .safari {
      position: relative;
      height: 260px;
      margin: 0.9rem -0.4rem 0.4rem;
      animation: rise 0.9s 0.25s ease both;
    }
    .safari img {
      position: absolute;
      filter: drop-shadow(0 10px 12px rgba(40, 60, 20, 0.28));
      user-select: none;
      -webkit-user-drag: none;
    }
    .a-lion {
      left: -2%;
      top: 8%;
      width: 118px;
      animation: floaty 3.8s ease-in-out infinite;
    }
    .a-monkey {
      right: -4%;
      top: -6%;
      width: 108px;
      transform-origin: 70% 0%;
      animation: swing 3.4s ease-in-out infinite;
    }
    .a-zebra {
      left: 8%;
      bottom: 0;
      width: 112px;
      animation: floaty 4.4s 0.3s ease-in-out infinite;
    }
    .a-elephant {
      right: 18%;
      bottom: 2%;
      width: 105px;
      animation: floaty 4s 0.5s ease-in-out infinite;
    }
    .a-giraffe {
      right: -2%;
      bottom: 18%;
      width: 92px;
      animation: floaty 5s 0.2s ease-in-out infinite;
    }

    .sign {
      position: absolute;
      left: 36%;
      bottom: 8%;
      width: 92px;
      z-index: 2;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.18));
      animation: floaty 4.6s 0.7s ease-in-out infinite;
    }

    /* Details — not a floating card, embedded dashed panel */
    .details {
      position: relative;
      z-index: 3;
      margin: 0.4rem auto 1.4rem;
      padding: 0.95rem 1rem;
      max-width: 22rem;
      text-align: left;
      background: rgba(255, 248, 231, 0.55);
      border: 2.5px dashed rgba(47, 122, 58, 0.45);
      border-radius: 1.15rem;
      backdrop-filter: blur(2px);
      animation: rise 0.85s 0.35s ease both;
    }
    .details li {
      list-style: none;
      display: grid;
      grid-template-columns: 1.7rem 1fr;
      gap: 0.55rem;
      align-items: center;
      padding: 0.48rem 0;
      font-weight: 800;
      font-size: 1rem;
    }
    .details li + li { border-top: 1px solid rgba(47, 122, 58, 0.14); }
    .details a {
      color: var(--leaf);
      text-decoration-thickness: 2px;
      text-underline-offset: 2px;
    }

    /* RSVP zone blended into jungle floor */
    .rsvp {
      position: relative;
      z-index: 6;
      margin: 0 auto;
      max-width: 22.5rem;
      text-align: center;
      animation: rise 0.9s 0.45s ease both;
    }
    .rsvp h2 {
      display: inline-block;
      font-family: "Baloo 2", cursive;
      font-size: 1.55rem;
      color: var(--cream);
      background: linear-gradient(180deg, #c07a3a, var(--wood) 50%, var(--wood2));
      padding: 0.35rem 1.3rem 0.45rem;
      border-radius: 0.4rem;
      box-shadow: 0 3px 0 var(--wood2);
      transform: rotate(-1.5deg);
      margin-bottom: 0.55rem;
    }
    .rsvp p {
      font-weight: 700;
      color: #3d5644;
      margin-bottom: 0.95rem;
      line-height: 1.35;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      min-width: 15rem;
      padding: 1.05rem 1.7rem;
      border-radius: 999px;
      text-decoration: none;
      color: #fff;
      font-family: "Baloo 2", cursive;
      font-weight: 800;
      font-size: 1.4rem;
      background: linear-gradient(180deg, #63bd52, var(--leaf2) 45%, var(--leaf) 80%, var(--canopy));
      box-shadow:
        0 6px 0 #12351a,
        0 16px 30px rgba(24, 72, 35, 0.35),
        inset 0 1px 0 rgba(255,255,255,0.35);
      animation: pulse 2.1s ease-in-out infinite;
      transition: transform .15s ease;
    }
    .cta:hover {
      transform: translateY(-3px) scale(1.04);
      animation: none;
    }
    .cta:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #12351a, 0 8px 16px rgba(24,72,35,.25);
      animation: none;
    }

    .qr {
      margin-top: 1.15rem;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
    }
    .qr img {
      width: 120px;
      height: 120px;
      padding: 0.4rem;
      background: var(--cream);
      border: 4px solid rgba(143, 212, 92, 0.75);
      border-radius: 1rem;
      box-shadow: 0 8px 18px rgba(40,60,20,0.18);
    }
    .qr span {
      font-family: "Baloo 2", cursive;
      font-weight: 700;
      color: var(--canopy);
    }

    .deadline {
      margin-top: 1rem;
      font-weight: 700;
      font-size: 0.9rem;
      color: #5a7260;
    }

    /* Floating sparkles */
    .spark {
      position: absolute;
      width: 12px;
      height: 12px;
      background: var(--sun);
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      animation: twinkle 2.8s ease-in-out infinite;
      z-index: 3;
      pointer-events: none;
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(10deg); }
    }
    @keyframes flutter {
      0%, 100% { transform: rotate(-7deg); }
      50% { transform: rotate(8deg); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2deg); }
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes swing {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(10deg); }
    }
    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 6px 0 #12351a, 0 16px 30px rgba(24,72,35,.35), 0 0 0 0 rgba(143,212,92,.35);
      }
      50% {
        box-shadow: 0 6px 0 #12351a, 0 16px 34px rgba(24,72,35,.45), 0 0 0 12px rgba(143,212,92,.12);
      }
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.86) translateY(18px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.25; transform: scale(0.7) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.15) rotate(18deg); }
    }

    @media (min-width: 520px) {
      .stage { padding-bottom: 9rem; }
      .safari { height: 290px; }
      .a-lion { width: 138px; }
      .a-monkey { width: 124px; }
      .a-zebra { width: 128px; }
      .a-elephant { width: 120px; }
      .a-giraffe { width: 108px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="world">
    <div class="canopy" aria-hidden="true">
      <span class="leaf big dark" style="left:-10px;top:-20px;animation-delay:0s"></span>
      <span class="leaf round" style="left:40px;top:-10px;animation-delay:.3s"></span>
      <span class="leaf" style="left:110px;top:-28px;animation-delay:.6s"></span>
      <span class="leaf big" style="left:180px;top:-16px;animation-delay:.2s"></span>
      <span class="leaf dark round" style="right:160px;top:-22px;animation-delay:.5s"></span>
      <span class="leaf" style="right:90px;top:-12px;animation-delay:.8s"></span>
      <span class="leaf big dark" style="right:20px;top:-26px;animation-delay:.1s"></span>
      <span class="leaf round" style="right:-20px;top:-8px;animation-delay:.4s"></span>
    </div>

    <div class="bunting" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>

    <main class="stage">
      <header class="brand">
        <span class="two">Two</span>
        <span class="wild">Wild</span>
        <span class="plank">to Handle</span>
      </header>

      <p class="lede">
        Join us for a wild celebration as we party for our little explorer’s
        <strong>2nd Birthday!</strong>
      </p>

      <span class="spark" style="left:8%; top:22%"></span>
      <span class="spark" style="right:10%; top:28%; animation-delay:.6s"></span>
      <span class="spark" style="left:18%; top:48%; animation-delay:1.1s"></span>

      <div class="safari" aria-label="Safari animals">
        <img class="a-lion" src="assets/lion.png" alt="Friendly lion" />
        <img class="a-monkey" src="assets/monkey.png" alt="Monkey swinging from a vine" />
        <img class="a-zebra" src="assets/zebra.png" alt="Zebra" />
        <img class="a-elephant" src="assets/elephant.png" alt="Baby elephant" />
        <img class="a-giraffe" src="assets/giraffe.png" alt="Giraffe" />

        <svg class="sign" viewBox="0 0 120 140" aria-hidden="true">
          <rect x="54" y="20" width="12" height="110" rx="3" fill="#6a3d14"/>
          <g transform="rotate(-6 60 40)">
            <rect x="18" y="28" width="84" height="22" rx="3" fill="#a2652e"/>
            <text x="60" y="44" text-anchor="middle" fill="#fff8e7" font-family="Baloo 2, sans-serif" font-size="11" font-weight="700">LET THE</text>
          </g>
          <g transform="rotate(4 60 65)">
            <rect x="12" y="54" width="96" height="22" rx="3" fill="#8b5526"/>
            <text x="60" y="70" text-anchor="middle" fill="#fff8e7" font-family="Baloo 2, sans-serif" font-size="11" font-weight="700">ADVENTURE</text>
          </g>
          <g transform="rotate(-3 60 90)">
            <rect x="22" y="80" width="76" height="22" rx="3" fill="#a2652e"/>
            <text x="60" y="96" text-anchor="middle" fill="#fff8e7" font-family="Baloo 2, sans-serif" font-size="11" font-weight="700">BEGIN!</text>
          </g>
        </svg>
      </div>

      <ul class="details">
        <li>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" stroke="#2f7a3a" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="#2f7a3a" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Sunday, August 16th</span>
        </li>
        <li>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="#2f7a3a" stroke-width="2"/><path d="M12 7v6l4 2" stroke="#2f7a3a" stroke-width="2" stroke-linecap="round"/></svg>
          <span>6:00 PM</span>
        </li>
        <li>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s7-5.2 7-11a7 7 0 1 0-14 0c0 5.8 7 11 7 11z" stroke="#2f7a3a" stroke-width="2"/><circle cx="12" cy="10" r="2.5" stroke="#2f7a3a" stroke-width="2"/></svg>
          <a href="https://maps.google.com/?q=29715+Thistle+Ln,+New+Hudson,+MI+48165" target="_blank" rel="noopener">
            29715 Thistle Ln, New Hudson, MI 48165
          </a>
        </li>
      </ul>

      <section class="rsvp" id="rsvp">
        <h2>RSVP</h2>
        <p>Can you join the adventure? Tap below to RSVP!</p>
        <a class="cta" href="https://forms.gle/KUo29x73aF3Jy5Kw6" target="_blank" rel="noopener">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <circle cx="6" cy="7" r="2.2"/><circle cx="12" cy="5" r="2.2"/><circle cx="18" cy="7" r="2.2"/>
            <ellipse cx="12" cy="15.5" rx="6" ry="5"/>
          </svg>
          RSVP Now
        </a>
        <div class="qr">
          <img src="qr-rsvp.png?v=3" width="120" height="120" alt="QR code to RSVP" />
          <span>Scan to RSVP</span>
        </div>
        <p class="deadline">Please RSVP by August 14th</p>
      </section>
    </main>

    <div class="undergrowth" aria-hidden="true">
      <span class="leaf big dark" style="left:-20px;bottom:-30px;animation-delay:.2s"></span>
      <span class="leaf round" style="left:50px;bottom:-20px;animation-delay:.5s"></span>
      <span class="leaf" style="left:130px;bottom:-36px;animation-delay:.1s"></span>
      <span class="leaf big" style="left:210px;bottom:-24px;animation-delay:.7s"></span>
      <span class="leaf dark round" style="right:180px;bottom:-28px;animation-delay:.3s"></span>
      <span class="leaf" style="right:100px;bottom:-18px;animation-delay:.6s"></span>
      <span class="leaf big dark" style="right:20px;bottom:-34px;animation-delay:.4s"></span>
      <span class="leaf round" style="right:-30px;bottom:-16px;animation-delay:.8s"></span>
    </div>
  </div>
</body>
</html>
