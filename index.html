<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Two Wild to Handle — 2nd Birthday</title>
  <meta name="description" content="Join us for a wild safari celebration — Sunday, August 16th at 6:00 PM in New Hudson, MI." />
  <meta property="og:title" content="Two Wild to Handle — 2nd Birthday" />
  <meta property="og:description" content="Sunday, August 16th · 6:00 PM · New Hudson, MI — RSVP inside!" />
  <meta property="og:image" content="invite-art.png?v=2" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lilita+One&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sand: #f4e7c7;
      --sand-deep: #e4cfa0;
      --leaf: #2d6a3a;
      --leaf-mid: #4a9a45;
      --leaf-bright: #7bc75a;
      --canopy: #1a4726;
      --wood: #9a6230;
      --wood-dark: #5d3814;
      --cream: #fff9eb;
      --ink: #1f2f24;
      --accent: #e8a23a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: "Nunito", system-ui, sans-serif;
      color: var(--ink);
      min-height: 100vh;
      background:
        radial-gradient(ellipse 90% 60% at 50% 0%, #dff3c4 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 100% 80%, #c8e4a8 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 0% 70%, #d7ecc0 0%, transparent 45%),
        linear-gradient(165deg, #eaf6d4 0%, var(--sand) 35%, var(--sand-deep) 100%);
      overflow-x: hidden;
    }

    /* Floating jungle sparkles / leaves */
    .ambiance {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .ambiance i {
      position: absolute;
      display: block;
      border-radius: 40% 60% 55% 45%;
      opacity: 0.55;
      animation: drift linear infinite;
      filter: blur(0.2px);
    }
    .ambiance i.leaf {
      width: 18px;
      height: 28px;
      background: linear-gradient(135deg, var(--leaf-bright), var(--leaf));
      box-shadow: inset -4px -2px 0 rgba(26, 71, 38, 0.25);
    }
    .ambiance i.star {
      width: 10px;
      height: 10px;
      border-radius: 0;
      background: var(--accent);
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      opacity: 0.7;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 520px;
      margin: 0 auto;
      padding: 0.75rem 0.75rem 2.75rem;
    }

    /* Hero art card */
    .hero {
      position: relative;
      border-radius: 1.35rem;
      overflow: hidden;
      isolation: isolate;
      box-shadow:
        0 0 0 4px rgba(45, 106, 58, 0.18),
        0 18px 40px rgba(45, 70, 30, 0.28),
        0 4px 0 rgba(26, 71, 38, 0.35);
      animation: pop-in 0.85s cubic-bezier(0.2, 0.9, 0.2, 1) both;
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, transparent 72%, rgba(30, 55, 30, 0.18) 100%),
        radial-gradient(circle at 20% 15%, rgba(255,255,255,0.18), transparent 35%);
      mix-blend-mode: soft-light;
    }
    .hero-art {
      display: block;
      width: 100%;
      height: auto;
      vertical-align: middle;
      transform-origin: 50% 40%;
      animation: safari-breathe 8s ease-in-out infinite;
    }

    /* Soft glow pulse behind art */
    .glow {
      position: absolute;
      inset: -8% -6%;
      z-index: -1;
      background: radial-gradient(circle, rgba(123, 199, 90, 0.45), transparent 65%);
      filter: blur(18px);
      animation: glow-pulse 3.2s ease-in-out infinite;
    }

    /* RSVP strip — continues the safari look */
    .trail {
      margin-top: 1.15rem;
      position: relative;
      padding: 1.35rem 1.1rem 1.4rem;
      background:
        linear-gradient(180deg, rgba(255, 249, 235, 0.92), rgba(244, 231, 199, 0.95));
      border: 3px dashed rgba(45, 106, 58, 0.4);
      border-radius: 1.25rem;
      box-shadow: 0 12px 28px rgba(45, 70, 30, 0.14);
      text-align: center;
      animation: rise 0.9s 0.25s ease both;
      overflow: hidden;
    }
    .trail::before,
    .trail::after {
      content: "";
      position: absolute;
      width: 88px;
      height: 88px;
      background: radial-gradient(circle at 30% 30%, var(--leaf-bright), var(--leaf) 55%, transparent 56%);
      opacity: 0.35;
      pointer-events: none;
    }
    .trail::before { top: -28px; left: -28px; }
    .trail::after { bottom: -34px; right: -24px; }

    .plank-title {
      display: inline-block;
      font-family: "Lilita One", "Baloo 2", cursive;
      font-size: 1.55rem;
      letter-spacing: 0.04em;
      color: var(--cream);
      background: linear-gradient(180deg, #b8773a, var(--wood) 48%, var(--wood-dark));
      padding: 0.4rem 1.35rem 0.5rem;
      border-radius: 0.4rem;
      box-shadow:
        0 3px 0 var(--wood-dark),
        inset 0 1px 0 rgba(255,255,255,0.25);
      transform: rotate(-2deg);
      margin-bottom: 0.7rem;
      animation: wiggle 4s ease-in-out infinite;
    }

    .trail p {
      position: relative;
      max-width: 22rem;
      margin: 0 auto 1.05rem;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.4;
      color: #35503c;
    }

    .cta {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-width: 15rem;
      padding: 1.05rem 1.75rem;
      border-radius: 999px;
      text-decoration: none;
      color: #fff;
      font-family: "Baloo 2", cursive;
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: 0.02em;
      background:
        linear-gradient(180deg, #5cb34e 0%, var(--leaf-mid) 42%, var(--leaf) 78%, var(--canopy));
      box-shadow:
        0 5px 0 #14351c,
        0 14px 30px rgba(26, 71, 38, 0.35),
        inset 0 1px 0 rgba(255,255,255,0.3);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      animation: bounce-cta 2.2s ease-in-out infinite;
      z-index: 1;
    }
    .cta:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow:
        0 7px 0 #14351c,
        0 18px 34px rgba(26, 71, 38, 0.4),
        inset 0 1px 0 rgba(255,255,255,0.3);
      animation: none;
    }
    .cta:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #14351c, 0 8px 16px rgba(26, 71, 38, 0.25);
      animation: none;
    }
    .cta .paw {
      width: 1.15rem;
      height: 1.15rem;
      display: inline-block;
    }

    .map-link {
      display: inline-block;
      margin-top: 0.95rem;
      font-weight: 800;
      font-size: 0.92rem;
      color: var(--leaf);
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
    }
    .map-link:hover { color: var(--canopy); }

    .qr-row {
      margin-top: 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      position: relative;
      z-index: 1;
    }
    .qr-row img {
      width: 128px;
      height: 128px;
      padding: 0.4rem;
      background: var(--cream);
      border: 4px solid rgba(123, 199, 90, 0.65);
      border-radius: 1rem;
      box-shadow: 0 8px 18px rgba(45, 70, 30, 0.15);
      animation: float-soft 3.6s ease-in-out infinite;
    }
    .qr-row span {
      font-family: "Baloo 2", cursive;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--canopy);
    }

    .foot {
      margin-top: 1.1rem;
      text-align: center;
      font-weight: 700;
      font-size: 0.88rem;
      color: #5d7363;
      animation: rise 0.9s 0.45s ease both;
    }

    /* Tiny animal stickers that peek around the RSVP box */
    .critter {
      position: absolute;
      width: 64px;
      height: 64px;
      z-index: 2;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.18));
      pointer-events: none;
    }
    .critter.left {
      left: -10px;
      top: -18px;
      animation: peek-left 3.8s ease-in-out infinite;
    }
    .critter.right {
      right: -8px;
      bottom: 36px;
      animation: peek-right 4.2s ease-in-out infinite;
    }

    @keyframes pop-in {
      from { opacity: 0; transform: translateY(28px) scale(0.94); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes safari-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.025); }
    }
    @keyframes glow-pulse {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 0.95; transform: scale(1.05); }
    }
    @keyframes bounce-cta {
      0%, 100% { transform: translateY(0); }
      40% { transform: translateY(-5px); }
      60% { transform: translateY(-2px); }
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2deg); }
    }
    @keyframes float-soft {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes peek-left {
      0%, 100% { transform: translate(0, 0) rotate(-8deg); }
      50% { transform: translate(6px, 4px) rotate(4deg); }
    }
    @keyframes peek-right {
      0%, 100% { transform: translate(0, 0) rotate(10deg); }
      50% { transform: translate(-6px, -5px) rotate(-4deg); }
    }
    @keyframes drift {
      0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.55; }
      90% { opacity: 0.45; }
      100% { transform: translateY(-12vh) rotate(360deg); opacity: 0; }
    }

    @media (min-width: 560px) {
      .wrap { padding-top: 1.5rem; }
      .critter { width: 76px; height: 76px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="ambiance" id="ambiance" aria-hidden="true"></div>

  <main class="wrap">
    <div class="glow" aria-hidden="true"></div>

    <figure class="hero">
      <img
        class="hero-art"
        src="invite-art.png?v=2"
        width="952"
        height="1024"
        alt="Two Wild to Handle — safari birthday invitation with lion, monkey, zebra, elephant, and giraffe"
      />
    </figure>

    <section class="trail" id="rsvp" aria-label="RSVP">
      <!-- peeking lion face -->
      <svg class="critter left" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="34" r="22" fill="#E39A2E"/>
        <circle cx="32" cy="34" r="15" fill="#F2C15A"/>
        <circle cx="26" cy="32" r="2.4" fill="#243028"/>
        <circle cx="38" cy="32" r="2.4" fill="#243028"/>
        <ellipse cx="32" cy="37" rx="3" ry="2.2" fill="#c46a22"/>
        <path d="M26 41c3 3 9 3 12 0" fill="none" stroke="#243028" stroke-width="2" stroke-linecap="round"/>
        <circle cx="14" cy="22" r="7" fill="#E39A2E"/>
        <circle cx="50" cy="22" r="7" fill="#E39A2E"/>
      </svg>
      <!-- peeking monkey -->
      <svg class="critter right" viewBox="0 0 64 64" aria-hidden="true">
        <ellipse cx="32" cy="36" rx="18" ry="16" fill="#8B6914"/>
        <ellipse cx="32" cy="40" rx="11" ry="9" fill="#E8C99A"/>
        <circle cx="26" cy="34" r="2.2" fill="#243028"/>
        <circle cx="38" cy="34" r="2.2" fill="#243028"/>
        <ellipse cx="32" cy="40" rx="3.5" ry="2.5" fill="#5c3a18"/>
        <path d="M27 45c3 2.5 7 2.5 10 0" fill="none" stroke="#243028" stroke-width="1.8" stroke-linecap="round"/>
        <ellipse cx="12" cy="34" rx="7" ry="8" fill="#8B6914"/>
        <ellipse cx="52" cy="34" rx="7" ry="8" fill="#8B6914"/>
      </svg>

      <div class="plank-title">RSVP</div>
      <p>Ready for the adventure? Tap below and let us know if you can join the safari!</p>

      <a class="cta" href="https://forms.gle/KUo29x73aF3Jy5Kw6" target="_blank" rel="noopener">
        <svg class="paw" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
          <circle cx="6" cy="7" r="2.2"/>
          <circle cx="12" cy="5" r="2.2"/>
          <circle cx="18" cy="7" r="2.2"/>
          <ellipse cx="12" cy="15.5" rx="6" ry="5"/>
        </svg>
        RSVP Now
      </a>

      <a class="map-link" href="https://maps.google.com/?q=29715+Thistle+Ln,+New+Hudson,+MI+48165" target="_blank" rel="noopener">
        Open map to party location
      </a>

      <div class="qr-row">
        <img src="qr-rsvp.png?v=2" width="128" height="128" alt="QR code to RSVP form" />
        <span>Scan to RSVP</span>
      </div>
    </section>

    <p class="foot">Please RSVP by August 14th · We can’t wait to celebrate!</p>
  </main>

  <script>
    (function () {
      const box = document.getElementById("ambiance");
      if (!box) return;
      const count = 18;
      for (let n = 0; n < count; n++) {
        const el = document.createElement("i");
        const isStar = n % 4 === 0;
        el.className = isStar ? "star" : "leaf";
        el.style.left = Math.random() * 100 + "%";
        el.style.animationDuration = 9 + Math.random() * 14 + "s";
        el.style.animationDelay = -Math.random() * 16 + "s";
        el.style.transform = "scale(" + (0.55 + Math.random() * 0.9) + ")";
        box.appendChild(el);
      }
    })();
  </script>
</body>
</html>
