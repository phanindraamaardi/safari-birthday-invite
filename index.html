<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Two Wild to Handle — 2nd Birthday Safari</title>
  <meta name="description" content="Join our little explorer’s wild 2nd birthday safari — Sunday, August 16th at 6:00 PM." />
  <meta property="og:title" content="Two Wild to Handle — 2nd Birthday" />
  <meta property="og:description" content="Sunday, August 16th · 6:00 PM · New Hudson, MI" />
  <meta property="og:image" content="assets/lion.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Pacifico&family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --leaf: #2c7338;
      --leaf2: #4a9a42;
      --canopy: #12351c;
      --wood: #9a5f2c;
      --wood2: #543110;
      --cream: #fff7e4;
      --ink: #1c3023;
      --sun: #e9a832;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: "Nunito", system-ui, sans-serif;
      color: var(--ink);
      background: #1a3a1c;
      overflow-x: hidden;
    }

    .world {
      position: relative;
      min-height: 100vh;
      overflow: clip;
      /* FULL FOREST — no empty beige */
      background:
        linear-gradient(180deg, rgba(18,53,28,.35) 0%, rgba(18,53,28,.1) 25%, rgba(80,60,20,.15) 70%, rgba(30,50,20,.45) 100%),
        url("assets/forest-bg.jpg?v=6") center top / cover no-repeat;
    }

    /* soft light rays + depth */
    .world::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 50% 35% at 50% 20%, rgba(255,230,150,.18), transparent 60%),
        radial-gradient(ellipse 80% 50% at 50% 100%, rgba(40,70,20,.35), transparent 55%);
    }

    /* ===== ANIMALS EVERYWHERE ===== */
    .fauna {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    .fauna img {
      position: absolute;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 16px 14px rgba(20, 40, 10, 0.45));
    }

    /* TOP canopy line */
    .f1 { top: 1%; left: -6%; width: clamp(120px, 34vw, 190px); animation: floaty 4s ease-in-out infinite; }
    .f2 { top: -1%; right: -4%; width: clamp(110px, 32vw, 180px); transform-origin: 70% 5%; animation: swing 3.2s ease-in-out infinite; }
    .f3 { top: 4%; left: 38%; width: clamp(70px, 18vw, 100px); animation: bob 3.5s .4s ease-in-out infinite; }

    /* UPPER mid — fills blank zones */
    .f4 { top: 14%; left: 2%; width: clamp(95px, 26vw, 140px); animation: floaty 4.4s .2s ease-in-out infinite; }
    .f5 { top: 12%; right: 2%; width: clamp(100px, 28vw, 150px); animation: floaty 5s .5s ease-in-out infinite; }
    .f6 { top: 22%; left: 22%; width: clamp(72px, 20vw, 110px); opacity: .95; animation: bob 4s .7s ease-in-out infinite; }
    .f7 { top: 20%; right: 20%; width: clamp(68px, 18vw, 105px); animation: bob 3.8s .3s ease-in-out infinite; }

    /* MIDDLE around content */
    .f8 { top: 36%; left: -8%; width: clamp(130px, 36vw, 200px); animation: peekL 5.2s ease-in-out infinite; }
    .f9 { top: 34%; right: -7%; width: clamp(120px, 34vw, 190px); animation: floaty 4.8s .4s ease-in-out infinite; }
    .f10 { top: 42%; left: 18%; width: clamp(80px, 22vw, 120px); animation: bob 4.2s .6s ease-in-out infinite; z-index: 3; }
    .f11 { top: 44%; right: 16%; width: clamp(85px, 23vw, 125px); animation: bob 3.9s .2s ease-in-out infinite; z-index: 3; }

    /* LOWER mid / path sides */
    .f12 { top: 58%; left: -4%; width: clamp(140px, 40vw, 220px); animation: floaty 4.5s .3s ease-in-out infinite; z-index: 4; }
    .f13 { top: 56%; right: -5%; width: clamp(135px, 38vw, 210px); animation: floaty 4.1s .6s ease-in-out infinite; z-index: 4; }
    .f14 { top: 62%; left: 28%; width: clamp(75px, 20vw, 115px); animation: bob 3.7s .5s ease-in-out infinite; z-index: 3; }
    .f15 { top: 64%; right: 26%; width: clamp(70px, 19vw, 110px); animation: bob 4.3s .1s ease-in-out infinite; z-index: 3; }

    /* BOTTOM forest floor — dense */
    .f16 { bottom: 0; left: -10%; width: clamp(160px, 44vw, 250px); animation: floaty 5s .2s ease-in-out infinite; z-index: 5; }
    .f17 { bottom: -2%; right: -8%; width: clamp(150px, 42vw, 240px); animation: floaty 4.6s .5s ease-in-out infinite; z-index: 5; }
    .f18 { bottom: 8%; left: 30%; width: clamp(90px, 24vw, 130px); animation: bob 3.6s .4s ease-in-out infinite; z-index: 4; }
    .f19 { bottom: 10%; right: 32%; width: clamp(85px, 22vw, 125px); animation: bob 4s .7s ease-in-out infinite; z-index: 4; }
    .f20 { bottom: 18%; left: 8%; width: clamp(70px, 18vw, 100px); animation: bob 3.4s .2s ease-in-out infinite; z-index: 3; }
    .f21 { bottom: 20%; right: 6%; width: clamp(75px, 19vw, 105px); transform-origin: 50% 0; animation: swing 3.8s ease-in-out infinite; z-index: 3; }

    /* Extra leaf clusters painted over empty gaps */
    .bushes {
      position: absolute;
      inset: 0;
      z-index: 6;
      pointer-events: none;
      background:
        radial-gradient(ellipse 40% 18% at 0% 15%, rgba(34,100,40,.85), transparent 70%),
        radial-gradient(ellipse 40% 18% at 100% 18%, rgba(20,70,30,.85), transparent 70%),
        radial-gradient(ellipse 45% 22% at 0% 70%, rgba(34,100,40,.9), transparent 70%),
        radial-gradient(ellipse 45% 22% at 100% 75%, rgba(20,70,30,.9), transparent 70%),
        radial-gradient(ellipse 70% 20% at 50% 100%, rgba(25,60,25,.75), transparent 65%),
        radial-gradient(ellipse 55% 14% at 50% 0%, rgba(20,60,25,.7), transparent 70%);
    }

    .leaf {
      position: absolute;
      z-index: 7;
      width: 70px;
      height: 90px;
      background: linear-gradient(145deg, #8fd45c, #2c7338 55%, #12351c);
      border-radius: 8% 80% 12% 78%;
      transform-origin: top center;
      animation: sway 4s ease-in-out infinite;
      pointer-events: none;
      box-shadow: inset -6px -4px 0 rgba(0,0,0,.15);
    }
    .leaf.big { width: 100px; height: 125px; }
    .leaf.round { width: 85px; height: 85px; border-radius: 45% 55% 50% 50%; }

    /* Center invite panel over the forest path */
    .stage {
      position: relative;
      z-index: 10;
      max-width: 380px;
      margin: 0 auto;
      padding: 1rem 0.85rem 2.25rem;
      text-align: center;
    }

    .panel {
      background: linear-gradient(180deg, rgba(255,247,228,.88), rgba(244,226,180,.82));
      border: 3px solid rgba(74, 120, 50, 0.45);
      border-radius: 1.4rem;
      padding: 1.1rem 1rem 1.25rem;
      box-shadow:
        0 0 0 6px rgba(255, 247, 228, 0.25),
        0 18px 40px rgba(20, 40, 10, 0.35);
      backdrop-filter: blur(4px);
      animation: pop 0.85s cubic-bezier(.2,.9,.2,1) both;
    }

    .bunting {
      display: flex;
      justify-content: center;
      gap: 0.3rem;
      margin-bottom: 0.35rem;
    }
    .bunting span {
      width: 1.45rem;
      height: 1.85rem;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      animation: flutter 2.6s ease-in-out infinite;
    }
    .bunting span:nth-child(odd) { background: var(--leaf2); }
    .bunting span:nth-child(even) { background: var(--sun); }
    .bunting span:nth-child(3n) { background: var(--canopy); }

    .brand .two {
      display: block;
      font-family: "Baloo 2", cursive;
      font-weight: 800;
      font-size: clamp(2.6rem, 12vw, 3.3rem);
      line-height: 0.9;
      color: var(--canopy);
      -webkit-text-stroke: 3px #fff;
      paint-order: stroke fill;
    }
    .brand .wild {
      display: block;
      font-family: "Pacifico", cursive;
      font-size: clamp(2.7rem, 13vw, 3.5rem);
      line-height: 1;
      color: #1b3f6e;
      -webkit-text-stroke: 3px #fff;
      paint-order: stroke fill;
      animation: bob 3.2s ease-in-out infinite;
    }
    .brand .plank {
      display: inline-block;
      margin-top: 0.25rem;
      padding: 0.3rem 1rem 0.4rem;
      font-family: "Baloo 2", cursive;
      font-weight: 800;
      font-size: 1.2rem;
      color: var(--cream);
      background: linear-gradient(180deg, #c07a3a, var(--wood) 48%, var(--wood2));
      border-radius: 0.35rem;
      box-shadow: 0 3px 0 var(--wood2);
      transform: rotate(-2deg);
    }

    .lede {
      margin: 0.75rem auto 0;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.4;
      color: #35553c;
    }
    .lede strong { color: var(--leaf); }

    .details {
      margin: 0.85rem auto 1rem;
      padding: 0.75rem 0.85rem;
      text-align: left;
      background: rgba(255,255,255,.35);
      border: 2px dashed rgba(44, 115, 56, 0.5);
      border-radius: 1rem;
    }
    .details li {
      list-style: none;
      display: grid;
      grid-template-columns: 1.5rem 1fr;
      gap: 0.45rem;
      align-items: center;
      padding: 0.4rem 0;
      font-weight: 800;
      font-size: 0.95rem;
    }
    .details li + li { border-top: 1px solid rgba(44,115,56,.15); }
    .details a {
      color: var(--leaf);
      text-decoration-thickness: 2px;
      text-underline-offset: 2px;
    }

    .rsvp h2 {
      display: inline-block;
      font-family: "Baloo 2", cursive;
      font-size: 1.4rem;
      color: var(--cream);
      background: linear-gradient(180deg, #c07a3a, var(--wood) 50%, var(--wood2));
      padding: 0.28rem 1.15rem 0.38rem;
      border-radius: 0.35rem;
      box-shadow: 0 3px 0 var(--wood2);
      transform: rotate(-1.5deg);
      margin-bottom: 0.4rem;
    }
    .rsvp p {
      font-weight: 700;
      color: #3d5644;
      margin-bottom: 0.7rem;
      font-size: 0.95rem;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      min-width: 13.5rem;
      padding: 0.95rem 1.5rem;
      border-radius: 999px;
      text-decoration: none;
      color: #fff;
      font-family: "Baloo 2", cursive;
      font-weight: 800;
      font-size: 1.3rem;
      background: linear-gradient(180deg, #63bd52, var(--leaf2) 45%, var(--leaf) 80%, var(--canopy));
      box-shadow: 0 5px 0 #12351a, 0 14px 28px rgba(24,72,35,.4);
      animation: pulse 2.1s ease-in-out infinite;
    }
    .cta:hover { transform: translateY(-3px) scale(1.03); animation: none; }

    .qr-row {
      margin-top: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
    }
    .qr-row img {
      width: 96px;
      height: 96px;
      padding: 0.3rem;
      background: #fff;
      border: 3px solid rgba(127, 200, 90, 0.85);
      border-radius: 0.85rem;
    }
    .qr-row span {
      font-family: "Baloo 2", cursive;
      font-weight: 700;
      color: var(--canopy);
      font-size: 0.95rem;
      text-align: left;
    }
    .deadline {
      margin-top: 0.7rem;
      font-weight: 700;
      font-size: 0.85rem;
      color: #5a7260;
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(12deg); }
    }
    @keyframes flutter {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(9deg); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-11px); }
    }
    @keyframes swing {
      0%, 100% { transform: rotate(-12deg); }
      50% { transform: rotate(14deg); }
    }
    @keyframes peekL {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(12px); }
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 5px 0 #12351a, 0 14px 28px rgba(24,72,35,.4), 0 0 0 0 rgba(143,212,92,.3); }
      50% { box-shadow: 0 5px 0 #12351a, 0 14px 32px rgba(24,72,35,.5), 0 0 0 12px rgba(143,212,92,.12); }
    }
    @keyframes pop {
      from { opacity: 0; transform: translateY(18px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (min-width: 640px) {
      .stage { max-width: 420px; padding-top: 1.5rem; }
      .f6, .f7, .f10, .f11, .f14, .f15 { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
